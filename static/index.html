<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Controle EPI NR-6</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://unpkg.com; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{
  --sidebar:#0f1117;--sidebar-hover:#1c1f2e;--sidebar-active:#1e2235;
  --sidebar-border:#252836;--bg:#f5f7fa;--card:#fff;--card-alt:#f8fafc;
  --input:#fff;--border:#e5e7eb;--focus:#3b82f6;
  --text:#111827;--muted:#6b7280;--hint:#9ca3af;--sidebar-text:#8b93a7;
  --blue:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--purple:#8b5cf6;
}
body{background:var(--bg);color:var(--text)}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0}
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--sidebar-border)}
.logo-icon{font-size:22px;color:var(--blue);margin-right:8px}
.logo-title{font-size:13px;font-weight:600;color:#fff;display:block}
.logo-sub{font-size:8px;color:var(--sidebar-text);display:block;margin-top:2px}
.user-pill{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--sidebar-border)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.user-name{font-size:11px;color:#fff;font-weight:500}
.user-role{font-size:9px;color:var(--sidebar-text)}
.nav-section{font-size:7px;font-weight:700;color:var(--sidebar-text);padding:10px 16px 4px;letter-spacing:.08em}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;position:relative;transition:background .12s;border-radius:6px;margin:1px 6px}
.nav-item:hover{background:var(--sidebar-hover)}
.nav-item.active{background:var(--sidebar-active)}
.nav-item.active::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--blue);border-radius:0 2px 2px 0}
.nav-label{font-size:11px;color:var(--sidebar-text)}
.nav-item.active .nav-label{color:#fff}
.sidebar-footer{margin-top:auto;border-top:1px solid var(--sidebar-border);padding:8px 6px}
.logout-btn{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;border-radius:6px;font-size:11px;color:var(--sidebar-text);transition:background .12s}
.logout-btn:hover{background:var(--sidebar-hover);color:#fff}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--card);border-bottom:.5px solid var(--border);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px}
.topbar-left{display:flex;flex-direction:column}
.page-title{font-size:15px;font-weight:600;color:var(--text)}
.page-sub{font-size:11px;color:var(--muted);margin-top:1px}
.content{flex:1;overflow-y:auto;padding:24px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn-primary{background:var(--blue);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-warning{background:var(--amber);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-secondary{background:#f3f4f6;color:#374151;border:.5px solid var(--border)}
.btn-sm{padding:5px 10px;font-size:10px}
/* SELETOR DE ESTADO */
.estado-selector{display:flex;align-items:center;gap:8px;background:#f8fafc;border:.5px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;position:relative;min-width:200px}
.estado-selector:hover{border-color:var(--blue)}
.estado-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0}
.estado-dot.all{background:var(--purple)}
.estado-label{font-size:11px;font-weight:600;color:var(--text);flex:1}
.estado-sub{font-size:9px;color:var(--muted)}
.estado-arrow{font-size:10px;color:var(--muted)}
.estado-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--card);border:.5px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:100;min-width:240px;overflow:hidden}
.estado-opt{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:11px;color:var(--text);transition:background .1s}
.estado-opt:hover{background:#f0f4ff}
.estado-opt.sel{background:#eff6ff;color:var(--blue);font-weight:600}
.estado-opt-uf{width:28px;height:20px;border-radius:3px;background:var(--blue);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.estado-opt-uf.all{background:var(--purple)}
.estado-divider{height:.5px;background:var(--border);margin:4px 0}
/* resto do CSS */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:.5px solid var(--border);border-radius:8px;overflow:hidden}
.kpi-bar{height:3px}.kpi-inner{padding:12px}
.kpi-label{font-size:10px;color:var(--muted)}.kpi-value{font-size:26px;font-weight:700;margin-top:4px}
.row2{display:grid;grid-template-columns:2fr 3fr;gap:16px;margin-bottom:20px}
.card{background:var(--card);border:.5px solid var(--border);border-radius:8px;overflow:hidden}
.card-bar{height:3px}.card-body{padding:16px}
.card-title{font-size:13px;font-weight:600;margin-bottom:4px}
.card-sub{font-size:10px;color:var(--muted);margin-bottom:12px}
.alert-item{font-size:11px;padding:6px 10px;border-radius:4px;margin-bottom:4px}
.alert-danger{background:#fef2f2;color:#991b1b}
.alert-warning{background:#fffbeb;color:#92400e}
.alert-ok{background:#ecfdf5;color:#065f46}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{background:#f9fafb;color:var(--muted);font-weight:500;padding:8px 12px;text-align:left;border-bottom:.5px solid var(--border);font-size:11px}
tbody tr{border-bottom:.5px solid var(--border);transition:background .1s}
tbody tr:hover{background:#f9fafb}
td{padding:8px 12px;color:var(--text)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
.badge-ok{background:#d1fae5;color:#065f46}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-danger{background:#fee2e2;color:#991b1b}
.badge-info{background:#dbeafe;color:#1d4ed8}
input,select,textarea{width:100%;padding:8px 10px;border:.5px solid var(--border);border-radius:6px;font-size:13px;background:var(--input);color:var(--text);outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--focus);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;margin-top:10px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--card);border-radius:10px;width:560px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-header{background:var(--blue);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{color:#fff;font-size:14px;font-weight:600}
.modal-close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:.5px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.err{color:var(--red);font-size:11px;margin-top:6px}
.login-bg{min-height:100vh;background:var(--sidebar);display:flex;align-items:center;justify-content:center}
.login-card{background:var(--card);border-radius:12px;width:400px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.login-top{background:var(--sidebar);padding:32px 28px 24px;text-align:center}
.login-icon{font-size:40px;color:var(--blue)}
.login-title{font-size:18px;font-weight:600;color:#fff;margin-top:8px}
.login-sub{font-size:11px;color:var(--sidebar-text);margin-top:4px}
.login-body{padding:24px 28px}
.login-btn{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;margin-top:16px;transition:background .15s}
.login-btn:hover{background:#2563eb}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useCallback, useRef} = React;

const API = window.location.origin;
let _token = localStorage.getItem("epi_token") || "";
let _user  = JSON.parse(localStorage.getItem("epi_user") || "null");

// tenant_filter_id = "" significa "todos os estados" (superadmin)
// tenant_filter_id = "abc123" significa filtrar por aquele tenant
let _tenantFilter = localStorage.getItem("epi_tenant_filter") || "";

async function api(method, path, body=null) {
  const opts = {
    method,
    headers: {"Content-Type":"application/json",
               ...(_token ? {"Authorization":`Bearer ${_token}`} : {})},
    ...(body ? {body: JSON.stringify(body)} : {}),
  };
  // Injeta filtro de tenant como query param quando superadmin seleciona um estado
  let url = `${API}/api${path}`;
  if (_tenantFilter && _user?.perfil === "superadmin") {
    const sep = url.includes("?") ? "&" : "?";
    url += `${sep}_tenant=${_tenantFilter}`;
  }
  const r = await fetch(url, opts);
  if (r.status === 401) { logout(); return null; }
  if (!r.ok) {
    const err = await r.json().catch(()=>({detail:"Erro desconhecido"}));
    throw new Error(Array.isArray(err.detail) ? err.detail.join(", ") : String(err.detail));
  }
  const ct = r.headers.get("content-type")||"";
  if (ct.includes("application/pdf")) return r.blob();
  if (r.status === 204) return null;
  return r.json();
}

function logout() {
  _token = ""; _user = null; _tenantFilter = "";
  localStorage.removeItem("epi_token");
  localStorage.removeItem("epi_user");
  localStorage.removeItem("epi_tenant_filter");
  window.location.reload();
}

function StatusBadge({status}) {
  const map = {
    OK:["badge-ok","✓ OK"],
    ABAIXO_MINIMO:["badge-warn","⚠ Estoque Baixo"],
    CA_VENCIDO:["badge-danger","✕ CA Vencido"],
    CA_ALERTA:["badge-warn","! CA Alerta"],
  };
  const [cls,lbl] = map[status]||["badge-info",status||"—"];
  return <span className={`badge ${cls}`}>{lbl}</span>;
}

function fmt_date(v) {
  if (!v) return "—";
  try { return new Date(v).toLocaleDateString("pt-BR"); } catch{ return v; }
}

// ── SELETOR DE ESTADO (superadmin only) ──────────────────────────────────
function EstadoSelector({tenants, value, onChange}) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(()=>{
    function handle(e){ if(ref.current && !ref.current.contains(e.target)) setOpen(false); }
    document.addEventListener("mousedown", handle);
    return ()=>document.removeEventListener("mousedown", handle);
  },[]);

  const sel = tenants.find(t=>t.id===value);
  const label = sel ? `${sel.estado_uf} — ${sel.nome}` : "Todos os estados";
  const isAll = !value;

  function pick(id) {
    _tenantFilter = id;
    localStorage.setItem("epi_tenant_filter", id);
    onChange(id);
    setOpen(false);
  }

  return (
    <div ref={ref} style={{position:"relative"}}>
      <div className="estado-selector" onClick={()=>setOpen(o=>!o)}>
        <div className={`estado-dot${isAll?" all":""}`}/>
        <div style={{flex:1}}>
          <div className="estado-label">{label}</div>
          <div className="estado-sub">{isAll ? "Visão consolidada" : "Filtrado por estado"}</div>
        </div>
        <span className="estado-arrow">{open?"▲":"▼"}</span>
      </div>
      {open && (
        <div className="estado-dropdown">
          <div className={`estado-opt${isAll?" sel":""}`} onClick={()=>pick("")}>
            <div className="estado-opt-uf all">★</div>
            <div>
              <div style={{fontWeight:600}}>Todos os estados</div>
              <div style={{fontSize:9,color:"var(--muted)"}}>Visão consolidada</div>
            </div>
          </div>
          <div className="estado-divider"/>
          {tenants.map(t=>(
            <div key={t.id} className={`estado-opt${value===t.id?" sel":""}`} onClick={()=>pick(t.id)}>
              <div className="estado-opt-uf">{t.estado_uf}</div>
              <div>
                <div>{t.nome}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── LOGIN ────────────────────────────────────────────────────────────────
function Login({onLogin}) {
  const [login,setLogin]=useState("");
  const [senha,setSenha]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  async function submit(e) {
    e.preventDefault(); setErr(""); setLoading(true);
    try {
      const data = await api("POST","/auth/login",{login,senha});
      _token = data.access_token;
      _user  = {nome:data.nome, perfil:data.perfil,
                tenant_id:data.tenant_id, tenant_nome:data.tenant_nome,
                precisa_trocar_senha:data.precisa_trocar_senha};
      localStorage.setItem("epi_token", _token);
      localStorage.setItem("epi_user", JSON.stringify(_user));
      onLogin(_user);
    } catch(ex) { setErr(ex.message); }
    setLoading(false);
  }

  return (
    <div className="login-bg">
      <div className="login-card">
        <div className="login-top">
          <div className="login-icon">⬡</div>
          <div className="login-title">EPI NR-6</div>
          <div className="login-sub">Sistema de Controle de Equipamentos</div>
        </div>
        <div className="login-body">
          <form onSubmit={submit}>
            <label>Usuário</label>
            <input value={login} onChange={e=>setLogin(e.target.value)} placeholder="login" autoFocus/>
            <label>Senha</label>
            <input type="password" value={senha} onChange={e=>setSenha(e.target.value)} autoComplete="current-password" placeholder="Digite sua senha"/>
            {err && <div className="err">⚠ {err}</div>}
            <button className="login-btn" disabled={loading}>
              {loading ? "Entrando..." : "Entrar →"}
            </button>
          </form>
          <p style={{fontSize:10,color:"var(--hint)",textAlign:"center",marginTop:12}}>
            v2.0 · NR-6 · Acesso seguro por tenant
          </p>
        </div>
      </div>
    </div>
  );
}

// ── DASHBOARD ────────────────────────────────────────────────────────────
function Dashboard({tenantFilter}) {
  const [kpis,setKpis]=useState(null);
  const [consumo,setConsumo]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    setLoading(true);
    Promise.all([
      api("GET","/dashboard/kpis"),
      api("GET","/dashboard/consumo-setor"),
    ]).then(([k,c])=>{ if(k)setKpis(k); if(c)setConsumo(c||[]); setLoading(false); });
  },[tenantFilter]);

  if(loading) return <div><p style={{fontSize:14,color:"var(--muted)"}}>Carregando...</p></div>;

  const kpiDefs = [
    {key:"total_itens",label:"Total em Estoque",color:"var(--blue)"},
    {key:"abaixo_minimo",label:"Abaixo do Mínimo",color:"var(--amber)"},
    {key:"ca_alertas",label:"Alertas de CA",color:"var(--red)"},
    {key:"colaboradores_7d",label:"Colaboradores (7d)",color:"var(--green)"},
  ];

  return (
    <div>
      <div className="kpi-grid">
        {kpiDefs.map(k=>(
          <div className="kpi" key={k.key}>
            <div className="kpi-bar" style={{background:k.color}}/>
            <div className="kpi-inner">
              <div className="kpi-label">{k.label}</div>
              <div className="kpi-value" style={{color:k.color}}>
                {kpis ? kpis[k.key] : "—"}
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="row2">
        <div className="card">
          <div className="card-bar" style={{background:"var(--red)"}}/>
          <div className="card-body">
            <div className="card-title">Alertas Ativos</div>
            <div className="card-sub">Estoque baixo e CA vencendo</div>
            {kpis?.alertas?.length===0 && <div className="alert-item alert-ok">✓ Nenhum alerta</div>}
            {kpis?.alertas?.map((a,i)=>(
              <div key={i} className={`alert-item ${a.includes("VENCIDO")?"alert-danger":"alert-warning"}`}>{a}</div>
            ))}
          </div>
        </div>
        <div className="card">
          <div className="card-bar" style={{background:"var(--blue)"}}/>
          <div className="card-body">
            <div className="card-title">Consumo por Setor (30 dias)</div>
            <div className="card-sub">Unidades entregues</div>
            {consumo.length===0
              ? <p style={{fontSize:12,color:"var(--muted)"}}>Sem dados no período.</p>
              : <table><thead><tr><th>Setor</th><th>Qtd. Entregue</th></tr></thead>
                <tbody>{consumo.map((r,i)=><tr key={i}><td>{r.setor}</td><td>{r.quantidade}</td></tr>)}</tbody>
                </table>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

// ── EPIs ──────────────────────────────────────────────────────────────────
function EPIsPage({tenantFilter}) {
  const [epis,setEpis]=useState([]);
  const [busca,setBusca]=useState("");
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(true);
  const TIPOS=["Impacto","Químico","Óptico","Queda","Auditiva","Respiratória","Térmica","Soldagem","Mãos","Pés","Cabeça","Outros"];
  const userPerms = PERMS[_user?.perfil] || new Set();
  const podeCriar = userPerms.has("cadastrar_epi");
  const podeEditar = userPerms.has("editar_epi");
  const podeInativar = userPerms.has("inativar_epi");

  const load = useCallback(async()=>{
    setLoading(true);
    const data = await api("GET",`/epis?busca=${busca}`);
    if(data) setEpis(data);
    setLoading(false);
  },[busca,tenantFilter]);

  useEffect(()=>{ const t = setTimeout(()=>load(), 300); return ()=>clearTimeout(t); },[busca,tenantFilter]);

  async function salvar() {
    setErr("");
    try {
      if(modal==="novo") await api("POST","/epis",form);
      else await api("PUT",`/epis/${modal.id}`,form);
      setModal(null); load();
    } catch(ex){ setErr(ex.message); }
  }

  async function inativar(id) {
    if(!confirm("Inativar este EPI?")) return;
    try { await api("DELETE",`/epis/${id}`); load(); }
    catch(ex) { setErr(ex.message); }
  }

  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <input style={{maxWidth:300}} placeholder="Buscar por nome, CA ou fabricante..."
          value={busca} onChange={e=>setBusca(e.target.value)}/>
        {podeCriar && <button className="btn btn-success" onClick={()=>{setForm({vida_util_dias:365,estoque_minimo:5,quantidade:0,tipo_protecao:TIPOS[0]});setErr("");setModal("novo");}}>➕ Novo EPI</button>}
      </div>
      {loading ? <p style={{fontSize:14,color:"var(--muted)"}}>Carregando...</p> : (
      <div className="card">
        <table>
          <thead><tr><th>Nome</th><th>CA</th><th>Fabricante</th><th>Tipo</th><th>Qtd</th><th>Mín</th><th>Validade CA</th><th>Status</th><th></th></tr></thead>
          <tbody>{epis.map(e=>(
            <tr key={e.id}>
              <td>{e.nome}</td><td>{e.ca}</td><td>{e.fabricante}</td>
              <td>{e.tipo_protecao}</td><td>{e.quantidade}</td><td>{e.estoque_minimo}</td>
              <td>{fmt_date(e.validade_ca)}</td>
              <td><StatusBadge status={e.status}/></td>
              {(podeEditar || podeInativar) && <td style={{display:"flex",gap:4}}>
                {podeEditar && <button className="btn btn-secondary btn-sm" onClick={()=>{setForm({...e,validade_ca:e.validade_ca?.slice(0,10)});setErr("");setModal(e);}}>✎</button>}
                {podeInativar && <button className="btn btn-danger btn-sm" onClick={()=>inativar(e.id)}>✕</button>}
              </td>}
            </tr>
          ))}</tbody>
        </table>
      </div>)}
      {modal && (
        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-header"><h3>{modal==="novo"?"Novo EPI":"Editar EPI"}</h3>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button></div>
            <div className="modal-body">
              <div className="form-row">
                <div><label>Nome *</label><input value={form.nome||""} onChange={e=>setForm({...form,nome:e.target.value})}/></div>
                <div><label>CA * (só dígitos)</label><input value={form.ca||""} onChange={e=>setForm({...form,ca:e.target.value})}/></div>
              </div>
              <div className="form-row">
                <div><label>Fabricante *</label><input value={form.fabricante||""} onChange={e=>setForm({...form,fabricante:e.target.value})}/></div>
                <div><label>Tipo de Proteção *</label>

function EntregasPage({tenantFilter}) {
  const [entregas,setEntregas]=useState([]);
  const [epis,setEpis]=useState([]);
  const [colabs,setColabs]=useState([]);
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({quantidade:1});
  const [err,setErr]=useState("");
  const [epiSel,setEpiSel]=useState(null);
  const [loading,setLoading]=useState(true);
  const userPermsEnt = PERMS[_user?.perfil] || new Set();
  const podeRegistrar = userPermsEnt.has("registrar_entrega");

  useEffect(()=>{
    setLoading(true);
    Promise.all([
      api("GET","/entregas?limit=50"),
      api("GET","/epis"),
      api("GET","/colaboradores"),
    ]).then(([e,ep,c])=>{ if(e)setEntregas(e); if(ep)setEpis(ep); if(c)setColabs(c); setLoading(false); });
  },[tenantFilter]);

  function onEpiChange(id) {
    setEpiSel(epis.find(x=>x.id===id)||null);
    setForm(f=>({...f,epi_id:id}));
  }

  async function confirmar() {
    setErr("");
    try {
      await api("POST","/entregas",form);
      setModal(false);
      api("GET","/entregas?limit=50").then(d=>d&&setEntregas(d));
      api("GET","/epis").then(d=>d&&setEpis(d));
    } catch(ex){ setErr(ex.message); }
  }

  async function downloadFicha(id) {
    const blob = await api("GET",`/entregas/${id}/ficha`);
    if(!blob) { alert("Erro ao baixar ficha: PDF não encontrado."); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href=url; a.download=`ficha-${id.slice(0,8)}.pdf`;
    a.click(); URL.revokeObjectURL(url);
  }

  return (
    <div>
      <div style={{display:"flex",justifyContent:"flex-end",marginBottom:16}}>
        {podeRegistrar && <button className="btn btn-success" onClick={()=>{setForm({quantidade:1});setErr("");setEpiSel(null);setModal(true);}}>
          ➕ Registrar Entrega
        </button>}
      </div>
      {loading ? <p style={{fontSize:14,color:"var(--muted)"}}>Carregando...</p> : (
      <div className="card">
        <table>
          <thead><tr><th>Data</th><th>Colaborador</th><th>EPI</th><th>Qtd</th><th>Val. Prevista</th><th></th></tr></thead>
          <tbody>{entregas.map(e=>(
            <tr key={e.id}>
              <td>{fmt_date(e.data)}</td><td>{e.colaborador_nome||"—"}</td>
              <td>{e.epi_nome||"—"}</td><td>{e.quantidade}</td>
              <td>{fmt_date(e.validade_prevista)}</td>
              <td><button className="btn btn-secondary btn-sm" onClick={()=>downloadFicha(e.id)}>📄 Ficha</button></td>
            </tr>
          ))}</tbody>
        </table>
      </div>)}
      {modal && (
        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setModal(false)}>
          <div className="modal">
            <div className="modal-header"><h3>Registrar Entrega de EPI</h3>
              <button className="modal-close" onClick={()=>setModal(false)}>✕</button></div>
            <div className="modal-body">
              <label>Colaborador *</label>
              <select value={form.colaborador_id||""} onChange={e=>setForm({...form,colaborador_id:e.target.value})}>
                <option value="">Selecione...</option>
                {colabs.map(c=><option key={c.id} value={c.id}>{c.nome} — {c.matricula} ({c.setor})</option>)}
              </select>
              <label>EPI *</label>
              <select value={form.epi_id||""} onChange={e=>onEpiChange(e.target.value)}>
                <option value="">Selecione...</option>
                {epis.map(e=><option key={e.id} value={e.id}>{e.nome} · CA {e.ca} · Saldo: {e.quantidade}</option>)}
              </select>
              {epiSel && (
                <div style={{background:"#f8fafc",border:".5px solid var(--border)",borderRadius:6,padding:"8px 12px",marginTop:8,fontSize:11}}>
                  CA: {epiSel.ca} &nbsp;·&nbsp; Validade: {fmt_date(epiSel.validade_ca)} &nbsp;·&nbsp; <StatusBadge status={epiSel.status}/>
                </div>
              )}
              <div className="form-row">
                <div><label>Quantidade *</label><input type="number" min="1" value={form.quantidade||1} onChange={e=>setForm({...form,quantidade:+e.target.value})}/></div>
                <div><label>Responsável</label><input value={form.responsavel||""} onChange={e=>setForm({...form,responsavel:e.target.value})}/></div>
              </div>
              <label>Observação</label>
              <textarea rows="2" value={form.observacao||""} onChange={e=>setForm({...form,observacao:e.target.value})}/>
              {err && <div className="err">⚠ {err}</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(false)}>Cancelar</button>
              <button className="btn btn-success" onClick={confirmar}>✔ Confirmar Entrega</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── COLABORADORES ─────────────────────────────────────────────────────────
function ColaboradoresPage({tenantFilter}) {
  const [colabs, setColabs]   = useState([]);
  const [setores, setSetores] = useState([]);
  const [modal, setModal]     = useState(null);
  const [form, setForm]       = useState({});
  const [err, setErr]         = useState("");
  const [novoSetor, setNovoSetor] = useState("");
  const [loading, setLoading] = useState(true);
  const userPermsColab = PERMS[_user?.perfil] || new Set();
  const podeCriarColab = userPermsColab.has("cadastrar_epi");

  const load = ()=>{
    setLoading(true);
    Promise.all([
      api("GET","/colaboradores"),
      api("GET","/setores"),
    ]).then(([c,s])=>{ if(c)setColabs(c); if(s)setSetores(s||[]); setLoading(false); });
  };
  useEffect(()=>{ load(); },[tenantFilter]);

  async function salvar() {
    setErr("");
    if(!form.nome?.trim())      { setErr("Nome obrigatório."); return; }
    if(!form.matricula?.trim()) { setErr("Matrícula obrigatória."); return; }
    if(!form.setor?.trim())     { setErr("Setor obrigatório."); return; }
    if(!form.funcao?.trim())    { setErr("Função obrigatória."); return; }
    try {
      if(modal==="novo") await api("POST","/colaboradores",form);
      else await api("PUT",`/colaboradores/${modal.id}`,form);
      setModal(null); load();
    } catch(ex){ setErr(ex.message); }
  }

  async function inativar(id, nome) {
    if(!confirm(`Inativar colaborador '${nome}'?`)) return;
    try { await api("DELETE",`/colaboradores/${id}`); load(); }
    catch(ex){ setErr(ex.message); }
  }

  async function addSetor() {
    const n = novoSetor.trim();
    if(!n) return;
    await api("POST",`/setores?nome=${encodeURIComponent(n)}`);
    setNovoSetor("");
    api("GET","/setores").then(d=>d&&setSetores(d||[]));
  }

  return (
    <div>
      <div style={{display:"flex",gap:8,marginBottom:16,alignItems:"center"}}>
        <span style={{fontSize:11,color:"var(--muted)",flex:1}}>
          {colabs.length} colaborador(es) cadastrado(s)
        </span>
        {podeCriarColab && <button className="btn btn-success"
          onClick={()=>{setForm({});setErr("");setModal("novo");}}>
          ➕ Novo Colaborador
        </button>}
      </div>
      {loading ? <p style={{fontSize:14,color:"var(--muted)"}}>Carregando...</p> : (
      <div className="card">
        <table>
          <thead><tr>
            <th>Nome</th><th>Matrícula</th><th>Setor</th><th>Função</th><th>Status</th><th></th>
          </tr></thead>
          <tbody>{colabs.map(c=>(
            <tr key={c.id}>
              <td>{c.nome}</td>
              <td>{c.matricula}</td>
              <td>{c.setor}</td>
              <td>{c.funcao}</td>
              <td><span className={`badge ${c.ativo?"badge-ok":"badge-danger"}`}>
                {c.ativo?"✓ Ativo":"✕ Inativo"}
              </span></td>
              {podeCriarColab && <td style={{display:"flex",gap:4}}>
                <button className="btn btn-secondary btn-sm"
                  onClick={()=>{setForm({...c});setErr("");setModal(c);}}>✎</button>
                <button className="btn btn-danger btn-sm"
                  onClick={()=>inativar(c.id,c.nome)}>✕</button>
              </td>}
            </tr>
          ))}</tbody>
        </table>
      </div>)}

      {modal && (
        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-header">
              <h3>{modal==="novo"?"Novo Colaborador":"Editar Colaborador"}</h3>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button>
            </div>
            <div className="modal-body">
              <div className="form-row">
                <div>
                  <label>Nome *</label>
                  <input value={form.nome||""}
                    onChange={e=>setForm({...form,nome:e.target.value})}
                    placeholder="Nome completo"/>
                </div>
                <div>
                  <label>Matrícula *</label>
                  <input value={form.matricula||""}
                    onChange={e=>setForm({...form,matricula:e.target.value})}
                    placeholder="Ex: 001"/>
                </div>
              </div>
              <div className="form-row">
                <div>
                  <label>Setor *</label>
                  <select value={form.setor||""}
                    onChange={e=>setForm({...form,setor:e.target.value})}>
                    <option value="">Selecione ou crie abaixo...</option>
                    {setores.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                  <div style={{display:"flex",gap:6,marginTop:6}}>
                    <input value={novoSetor}
                      onChange={e=>setNovoSetor(e.target.value)}
                      placeholder="Criar novo setor..."
                      style={{fontSize:11,padding:"5px 8px"}}
                      onKeyDown={e=>e.key==="Enter"&&addSetor()}/>
                    <button className="btn btn-secondary btn-sm" onClick={addSetor}>+ Criar</button>
                  </div>
                </div>
                <div>
                  <label>Função *</label>
                  <input value={form.funcao||""}
                    onChange={e=>setForm({...form,funcao:e.target.value})}
                    placeholder="Ex: Operador, Técnico"/>
                </div>
              </div>
              {err && <div className="err">⚠ {err}</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancelar</button>
              <button className="btn btn-success" onClick={salvar}>✔ Salvar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function RelatoriosPage() {

    {label:"Estoque Atual",color:"var(--blue)",path:"/relatorios/estoque",file:"estoque.pdf",sub:"Todos os EPIs com status"},

  ];
  return (
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
      {btns.map(b=>(
        <div key={b.path} className="card" style={{cursor:"pointer"}} onClick={()=>baixar(b.path,b.file)}>

}

            <tr key={u.id}>
              <td>{u.nome}</td><td><code>{u.login}</code></td>
              <td><span className="badge badge-info">{u.perfil}</span></td>
              <td>{u.tenant_id ? tMap[u.tenant_id]||u.tenant_id : "— Todos —"}</td>
              <td><span className={`badge ${u.ativo?"badge-ok":"badge-danger"}`}>{u.ativo?"✓ Ativo":"✕ Inativo"}</span></td>
              <td><button className="btn btn-secondary btn-sm" onClick={()=>{setForm({...u});setErr("");setModal(u);}}>✎</button></td>
            </tr>
          ))}</tbody>
        </table>
      </div>
      {modal && (
        <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          <div className="modal">
            <div className="modal-header"><h3>{modal==="novo"?"Novo Usuário":"Editar Usuário"}</h3>
              <button className="modal-close" onClick={()=>setModal(null)}>✕</button></div>
            <div className="modal-body">
              <div className="form-row">
                <div><label>Nome *</label><input value={form.nome||""} onChange={e=>setForm({...form,nome:e.target.value})}/></div>
                <div><label>Login *</label><input value={form.login||""} onChange={e=>setForm({...form,login:e.target.value})} disabled={modal!=="novo"}/></div>
              </div>
              <label>{modal==="novo"?"Senha *":"Nova senha (em branco = manter)"}</label>
              <input type="password" autoComplete={modal==="novo"?"new-password":"off"} value={form.senha||form.nova_senha||""} onChange={e=>setForm({...form,[modal==="novo"?"senha":"nova_senha"]:e.target.value})}/>
              <div className="form-row">
                <div><label>Perfil *</label>
                  <select value={form.perfil||"operador"} onChange={e=>setForm({...form,perfil:e.target.value})}>
                    {["superadmin","admin","operador","visualizador"].map(p=><option key={p}>{p}</option>)}
                  </select>
                </div>
                <div><label>Estado (Tenant)</label>
                  <select value={form.tenant_id||""} onChange={e=>setForm({...form,tenant_id:e.target.value||null})}>
                    <option value="">— Todos (Superadmin) —</option>
                    {(tenants||[]).map(t=><option key={t.id} value={t.id}>{t.estado_uf} — {t.nome}</option>)}
                  </select>
                </div>
              </div>
              {err && <div className="err">⚠ {err}</div>}
            </div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={()=>setModal(null)}>Cancelar</button>
              <button className="btn btn-success" onClick={salvar}>✔ Salvar</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── CONFIG ────────────────────────────────────────────────────────────────
function ConfigPage() {
  const [cfg,setCfg]=useState({});
  const [ok,setOk]=useState("");
  const userPerms = PERMS[_user?.perfil] || new Set();
  const podeEditar = userPerms.has("editar_config");
  useEffect(()=>{ api("GET","/config").then(d=>d&&setCfg(d)); },[]);
  async function salvar() {
    try { await api("PUT","/config",cfg); setOk("✓ Salvo!"); setTimeout(()=>setOk(""),3000); }
    catch(ex){ setOk(ex.message); }
  }
  return (
    <div className="card" style={{maxWidth:520}}>
      <div className="card-bar" style={{background:"var(--blue)"}}/>
      <div className="card-body">
        <div className="card-title">Configurações</div>
        <label>Nome da empresa</label><input value={cfg.empresa_nome||""} onChange={e=>setCfg({...cfg,empresa_nome:e.target.value})} disabled={!podeEditar}/>
        <label>CNPJ</label><input value={cfg.empresa_cnpj||""} onChange={e=>setCfg({...cfg,empresa_cnpj:e.target.value})} disabled={!podeEditar}/>
        <label>Endereço</label><input value={cfg.empresa_endereco||""} onChange={e=>setCfg({...cfg,empresa_endereco:e.target.value})} disabled={!podeEditar}/>
        <label>Dias de alerta CA a vencer</label><input type="number" value={cfg.dias_alerta_ca||30} onChange={e=>setCfg({...cfg,dias_alerta_ca:e.target.value})} disabled={!podeEditar}/>
        {ok && <div style={{marginTop:8,fontSize:11,color:ok.startsWith("✓")?"var(--green)":"var(--red)"}}>{ok}</div>}
        {podeEditar && <div style={{marginTop:16}}><button className="btn btn-success" onClick={salvar}>✔ Salvar</button></div>}
      </div>
    </div>
  );
}

// ── APP SHELL ─────────────────────────────────────────────────────────────
const PAGES = {
  dashboard:      {label:"◉  Dashboard",       perm:"ver_dashboard",      comp:Dashboard},
  epis:           {label:"◈  EPIs",            perm:"cadastrar_epi",       comp:EPIsPage},
  colaboradores:  {label:"◎  Colaboradores",   perm:"cadastrar_epi",       comp:ColaboradoresPage},
  entregas:       {label:"◑  Entregas",        perm:"registrar_entrega",   comp:EntregasPage},
  estoque:        {label:"▣  Estoque",         perm:"entrada_estoque",     comp:EstoquePage},
  relatorios:     {label:"◫  Relatórios",      perm:"ver_relatorios",      comp:RelatoriosPage},
  admin:          {label:"◆  Administração",   perm:"gerenciar_usuarios",  comp:AdminPage},
  config:         {label:"◌  Configurações",   perm:"ver_config",          comp:ConfigPage},
};
const PERMS = {
  superadmin:   new Set([...Object.values(PAGES).map(p=>p.perm),"editar_epi","inativar_epi","ajuste_estoque","editar_config","backup"]),
  admin:        new Set(["ver_dashboard","cadastrar_epi","editar_epi","inativar_epi","registrar_entrega","entrada_estoque","ajuste_estoque","ver_relatorios","gerenciar_usuarios","ver_config","editar_config","backup"]),
  operador:     new Set(["ver_dashboard","cadastrar_epi","editar_epi","registrar_entrega","entrada_estoque","ajuste_estoque","ver_relatorios"]),
  visualizador: new Set(["ver_dashboard","ver_relatorios"]),
};
const PAGE_TITLES = {
  dashboard:"Dashboard",epis:"Cadastro de EPIs",colaboradores:"Colaboradores",
  entregas:"Entregas",estoque:"Estoque",relatorios:"Relatórios",
  admin:"Administração",config:"Configurações",
};

function AppShell({user}) {
  const [page, setPage]           = useState("dashboard");
  const [tenantFilter, setTenantFilter] = useState(_tenantFilter);
  const [tenants, setTenants]     = useState([]);
  const isSuperAdmin = user.perfil === "superadmin";
  const perms   = PERMS[user.perfil] || new Set();
  const visivel = Object.entries(PAGES).filter(([,p])=>perms.has(p.perm));
  const PageComp = PAGES[page]?.comp || Dashboard;

  // Carrega lista de estados para o seletor (só superadmin)
  useEffect(()=>{
    if(isSuperAdmin) api("GET","/tenants").then(d=>d&&setTenants(d));
  },[]);

  function onTenantChange(id) {
    _tenantFilter = id;
    localStorage.setItem("epi_tenant_filter", id);
    setTenantFilter(id);
  }

  const selTenant = tenants.find(t=>t.id===tenantFilter);
  const estadoLabel = selTenant
    ? `${selTenant.estado_uf} — ${selTenant.nome}`
    : (user.tenant_nome || "Todos os estados");

  return (
    <div className="app">
      <div className="sidebar">
        <div className="logo">
          <span className="logo-icon">⬡</span>
          <span className="logo-title">EPI NR-6</span>
          <span className="logo-sub">{estadoLabel}</span>
        </div>
        <div className="user-pill">
          <div className="avatar">{user.nome[0].toUpperCase()}</div>
          <div>
            <div className="user-name">{user.nome}</div>
            <div className="user-role">{user.perfil.charAt(0).toUpperCase()+user.perfil.slice(1)}</div>
          </div>
        </div>
        <div className="nav-section">MENU</div>
        {visivel.map(([key,p])=>(
          <div key={key} className={`nav-item${page===key?" active":""}`} onClick={()=>setPage(key)}>
            <span className="nav-label">{p.label}</span>
          </div>
        ))}
        <div className="sidebar-footer">
          <div className="logout-btn" onClick={logout}>⇠ &nbsp; Sair</div>
        </div>
      </div>

      <div className="main">
        <div className="topbar">
          <div className="topbar-left">
            <div className="page-title">{PAGE_TITLES[page]}</div>
            <div className="page-sub">{estadoLabel}</div>
          </div>
          {/* Seletor de estado — só para superadmin */}
          {isSuperAdmin && tenants.length > 0 && (
            <EstadoSelector
              tenants={tenants}
              value={tenantFilter}
              onChange={onTenantChange}
            />
          )}
        </div>
        <div className="content">
          <PageComp tenantFilter={tenantFilter}/>
        </div>
      </div>
    </div>
  );
}

// ── TROCAR SENHA MODAL ─────────────────────────────────────────────────────
function TrocarSenhaModal({user, onDone}) {
  const [atual,setAtual]=useState("");
  const [nova,setNova]=useState("");
  const [confirma,setConfirma]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [ok,setOk]=useState(false);
  async function submit(e) {
    e.preventDefault(); setErr(""); setLoading(true);
    if (nova !== confirma) { setErr("Senhas não conferem"); setLoading(false); return; }
    if (nova.length < 6) { setErr("Nova senha deve ter no mínimo 6 caracteres"); setLoading(false); return; }
    try {
      await api("POST","/auth/trocar-senha",{senha_atual:atual,nova_senha:nova});
      setOk(true);
      user.precisa_trocar_senha = false;
      localStorage.setItem("epi_user", JSON.stringify(user));
      setTimeout(onDone, 1500);
    } catch(ex) { setErr(ex.message); }
    setLoading(false);
  }
  return (
    <div className="login-bg">
      <div className="login-card" style={{maxWidth:400}}>
        <div className="login-top">
          <div className="login-icon">🔒</div>
          <div className="login-title">Trocar Senha</div>
          <div className="login-sub">Você está usando uma senha padrão. Defina uma nova senha.</div>
        </div>
        <div className="login-body">
          {ok ? <p style={{textAlign:"center",color:"var(--green)",fontSize:13}}>✓ Senha alterada com sucesso!</p>
          : <form onSubmit={submit}>
              <label>Senha Atual</label>
              <input type="password" value={atual} onChange={e=>setAtual(e.target.value)} autoFocus autoComplete="current-password" placeholder="Senha atual"/>
              <label>Nova Senha</label>
              <input type="password" value={nova} onChange={e=>setNova(e.target.value)} autoComplete="new-password" placeholder="Nova senha (mín. 6 caracteres)"/>
              <label>Confirmar Nova Senha</label>
              <input type="password" value={confirma} onChange={e=>setConfirma(e.target.value)} autoComplete="new-password" placeholder="Repita a nova senha"/>
              {err && <div className="err">⚠ {err}</div>}
              <button className="btn btn-primary" style={{width:"100%",marginTop:12,justifyContent:"center"}} disabled={loading}>
                {loading ? "Salvando..." : "Salvar Nova Senha"}
              </button>
            </form>}
        </div>
      </div>
    </div>
  );
}

// ── ROOT ──────────────────────────────────────────────────────────────────
function Root() {
  const [user,setUser]=useState(_user);
  const [trocarSenha,setTrocarSenha]=useState(false);
  if (!user) return <Login onLogin={u=>{setUser(u); if(u.precisa_trocar_senha) setTrocarSenha(true);}}/>;
  if (trocarSenha) return <TrocarSenhaModal user={user} onDone={()=>setTrocarSenha(false)}/>;
  return <AppShell user={user}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
